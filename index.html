<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Toolkit - Advanced Offline PDF Suite</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <header>
        <div class="logo">📄 PDF Toolkit</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="टूल खोजें...">
        </div>
    </header>

    <div class="main-container">
        <sidebar>
            <h3 style="margin-bottom: 1rem; font-size: 1rem; color: #94a3b8;">श्रेणियाँ</h3>
            <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.5rem;">
                <li><a href="#" style="color: var(--text-primary); text-decoration: none;">सभी टूल्स (25)</a></li>
            </ul>
        </sidebar>

        <content-area>
            <div id="toolsGrid" class="tools-grid">
                <!-- JavaScript द्वारा गतिशील रूप से टूल्स लोड होंगे -->
            </div>
        </content-area>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
