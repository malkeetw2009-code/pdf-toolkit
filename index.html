<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Toolkit - Advanced Offline PDF Suite</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <header>
        <div class="logo">📄 PDF Toolkit</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="टूल खोजें...">
        </div>
    </header>

    <div class="main-container">
        <sidebar>
            <h3 style="margin-bottom: 1rem; font-size: 1rem; color: #94a3b8;">श्रेणियाँ</h3>
            <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.5rem;">
                <li><a href="#" id="homeLink" style="color: var(--text-primary); text-decoration: none;">सभी टूल्स (25)</a></li>
            </ul>
        </sidebar>

        <content-area>
            <!-- टूल्स ग्रिड -->
            <div id="toolsGrid" class="tools-grid"></div>

            <!-- वास्तविक टूल वर्कस्पेस (शुरुआत में छुपा हुआ) -->
            <div id="toolWorkspace" class="workspace" style="display: none;">
                <button id="backButton" style="width: fit-content; background: #334155; margin-bottom: 1rem;">← सभी टूल्स पर वापस जाएं</button>
                <h2 id="activeToolTitle">Tool Title</h2>
                <p id="activeToolDesc" style="color: var(--text-secondary);">Tool description goes here.</p>
                
                <div id="dropzone" class="dropzone">
                    <p>📁 फाइलें यहाँ खींच कर लाएं (Drag & Drop) या क्लिक करके चुनें</p>
                    <input type="file" id="fileInput" multiple style="display: none;" accept=".pdf,.jpg,.jpeg,.png">
                </div>

                <div id="fileList" style="margin-top: 1rem; font-size: 0.9rem; color: var(--text-secondary);"></div>

                <button id="processBtn" style="margin-top: 1rem; display: none;">प्रक्रिया शुरू करें (Process)</button>

                <div class="progress-container" id="progressContainer" style="margin-top: 1rem;">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div id="resultContainer" style="margin-top: 1.5rem;"></div>
            </div>
        </content-area>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
